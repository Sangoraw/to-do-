<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="スケジュール">
  <title>スケジュール管理</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon.svg">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <h1>スケジュール管理</h1>
    <div class="header-actions">
      <button class="header-btn" id="today-btn">今日</button>
      <button class="header-btn" id="notify-permission-btn">通知を許可</button>
    </div>
  </header>

  <!-- PWA install banner -->
  <div class="install-banner" id="install-banner" style="display:none">
    <p>ホーム画面に追加してアプリとして使えます</p>
    <div class="install-banner-actions">
      <button class="install-btn" id="install-btn">追加する</button>
      <button class="dismiss-btn" id="dismiss-install" aria-label="閉じる">✕</button>
    </div>
  </div>

  <!-- Calendar -->
  <main class="calendar-container">
    <div class="cal-nav">
      <button class="cal-nav-btn" id="prev-month" aria-label="前の月">&#8249;</button>
      <span id="cal-title"></span>
      <button class="cal-nav-btn" id="next-month" aria-label="次の月">&#8250;</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </main>

  <!-- Overlay -->
  <div class="panel-overlay" id="panel-overlay"></div>

  <!-- Day panel (bottom sheet) -->
  <div class="day-panel" id="day-panel" role="dialog" aria-modal="true">
    <div class="panel-handle"></div>
    <div class="panel-header">
      <h2 id="panel-date"></h2>
      <button class="close-btn" id="close-panel-btn" aria-label="閉じる">✕</button>
    </div>
    <div class="panel-body" id="panel-body">
      <!-- タイムラインはJavaScriptで生成 -->
    </div>
  </div>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item active">
      <span class="nav-icon">📅</span>
      <span>カレンダー</span>
    </a>
    <a href="./todo.html" class="nav-item">
      <span class="nav-icon">✅</span>
      <span>ToDoリスト</span>
    </a>
  </nav>

  <script src="./app.js"></script>
</body>
</html>
