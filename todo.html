<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ToDoリスト</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary:      #667eea;
      --primary-dark: #5a67d8;
      --bg:           #f0f4f8;
      --white:        #ffffff;
      --text:         #2d3748;
      --text-light:   #718096;
      --border:       #e2e8f0;
      --success:      #48bb78;
      --danger:       #e53e3e;
    }

    body {
      font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', 'Yu Gothic', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--primary);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      padding-top: calc(14px + env(safe-area-inset-top));
      box-shadow: 0 2px 12px rgba(102,126,234,0.45);
    }

    .app-header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }

    .header-date {
      font-size: 0.82rem;
      opacity: 0.88;
      background: rgba(255,255,255,0.18);
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* Main content */
    .content {
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: 80px;
    }

    /* Today badge */
    .today-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding: 10px 14px;
      background: var(--white);
      border-radius: 10px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    .today-badge .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--primary);
      flex-shrink: 0;
    }

    .today-badge span { font-size: 0.88rem; color: var(--text-light); }

    /* Input area */
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
      background: var(--white);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.07);
    }

    #task-input {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      color: var(--text);
      background: var(--white);
    }

    #task-input:focus { border-color: var(--primary); }

    /* モード切替トグル */
    .mode-toggle {
      display: flex;
      gap: 4px;
      margin-bottom: 8px;
    }

    .mode-btn {
      flex: 1;
      padding: 7px 0;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      color: var(--text-light);
      font-size: 0.85rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--white);
      font-weight: 600;
    }

    .input-row2 {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .time-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--white);
      transition: border-color 0.2s;
    }

    .time-wrap:focus-within { border-color: var(--primary); }

    .time-icon { font-size: 0.9rem; flex-shrink: 0; }

    .time-wrap select {
      border: none;
      outline: none;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      width: 100%;
      cursor: pointer;
    }

    .time-wrap select option:disabled {
      color: #c0c8d8;
      background: #f7f9fc;
    }

    #add-btn {
      padding: 10px 20px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
      flex-shrink: 0;
    }

    #add-btn:hover, #add-btn:active { background: var(--primary-dark); }

    /* Section headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 4px 0 10px;
    }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .task-count-badge {
      font-size: 0.75rem;
      color: var(--white);
      background: var(--primary);
      border-radius: 10px;
      padding: 2px 8px;
    }

    /* Task list */
    #task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--white);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: background 0.2s, border-color 0.2s;
    }

    .task-item.done {
      background: #f7fafc;
      border-color: #c6f6d5;
    }

    .task-item input[type="checkbox"] {
      width: 20px; height: 20px;
      accent-color: var(--success);
      cursor: pointer;
      flex-shrink: 0;
    }

    .task-info { flex: 1; min-width: 0; }

    .task-text {
      display: block;
      font-size: 1rem;
      color: var(--text);
      word-break: break-word;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
      color: var(--text-light);
    }

    .task-time {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--primary);
      margin-top: 3px;
    }

    .task-item.done .task-time { color: var(--text-light); }

    .delete-btn {
      background: none;
      border: none;
      color: #cbd5e0;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      flex-shrink: 0;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover, .delete-btn:active {
      color: var(--danger);
      background: #fff5f5;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-light);
      font-size: 0.95rem;
      padding: 32px 0;
    }

    /* Notification permission banner */
    .notify-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #ebf4ff;
      border: 1.5px solid #bee3f8;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 16px;
    }

    .notify-banner p {
      font-size: 0.88rem;
      color: var(--text);
      flex: 1;
    }

    .notify-banner button {
      padding: 8px 14px;
      background: var(--primary);
      color: var(--white);
      border: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Bottom nav */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      text-decoration: none;
      color: var(--text-light);
      font-size: 0.72rem;
      gap: 3px;
      transition: color 0.2s;
    }

    .nav-item.active { color: var(--primary); font-weight: 600; }

    .nav-item:first-child {
      border-right: 2px solid var(--border);
    }

    .nav-icon { font-size: 1.3rem; line-height: 1; }

    /* Past unfinished tasks */
    .past-section {
      margin-top: 24px;
    }

    .past-date-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--danger);
      padding: 10px 4px 6px;
    }

    #past-task-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }

    .past-task {
      border-color: #fed7d7;
      background: #fff5f5;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>ToDoリスト</h1>
    <span class="header-date" id="header-date"></span>
  </header>

  <main class="content">
    <div class="notify-banner" id="notify-banner" style="display:none">
      <p>通知を許可すると、タスクの時間にお知らせが届きます</p>
      <button id="notify-banner-btn">許可する</button>
    </div>

    <div class="today-badge">
      <div class="dot"></div>
      <span id="today-label">今日のタスク</span>
    </div>

    <div class="input-area">
      <input type="text" id="task-input" placeholder="タスクを追加..." autocomplete="off" />
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-time">🕐 時刻指定</button>
        <button class="mode-btn" id="mode-timer">⏱ タイマー</button>
      </div>
      <div class="input-row2">
        <div class="time-wrap" id="time-wrap">
          <span class="time-icon">🕐</span>
          <select id="time-input">
            <option value="">時間を選択</option>
          </select>
        </div>
        <div class="time-wrap" id="timer-wrap" style="display:none">
          <span class="time-icon">⏱</span>
          <select id="timer-input">
            <option value="">分後を選択</option>
          </select>
        </div>
        <button id="add-btn">追加</button>
      </div>
    </div>

    <div class="section-header">
      <span class="section-title">タスク一覧</span>
      <span class="task-count-badge" id="task-count">0</span>
    </div>

    <ul id="task-list"></ul>
    <p class="empty-msg" id="empty-msg">今日のタスクはありません</p>

    <div class="past-section" id="past-tasks-container" style="display:none">
      <div class="section-header">
        <span class="section-title">未完了の過去タスク</span>
        <span class="task-count-badge" id="past-count">0</span>
      </div>
      <ul id="past-task-list"></ul>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="./index.html" class="nav-item">
      <span class="nav-icon">📅</span>
      <span>カレンダー</span>
    </a>
    <a href="./todo.html" class="nav-item active">
      <span class="nav-icon">✅</span>
      <span>ToDoリスト</span>
    </a>
  </nav>

  <script>
    const input      = document.getElementById('task-input');
    const timeInput  = document.getElementById('time-input');
    const timerInput = document.getElementById('timer-input');
    const addBtn     = document.getElementById('add-btn');
    const taskList   = document.getElementById('task-list');
    const emptyMsg   = document.getElementById('empty-msg');
    const countBadge = document.getElementById('task-count');
    const modeTimeBtn  = document.getElementById('mode-time');
    const modeTimerBtn = document.getElementById('mode-timer');
    const timeWrap     = document.getElementById('time-wrap');
    const timerWrap    = document.getElementById('timer-wrap');

    let mode = 'time'; // 'time' | 'timer'

    const today   = new Date();
    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    const dayNames = ['日','月','火','水','木','金','土'];

    document.getElementById('header-date').textContent =
      `${today.getMonth()+1}月${today.getDate()}日（${dayNames[today.getDay()]}）`;
    document.getElementById('today-label').textContent =
      `${today.getMonth()+1}月${today.getDate()}日（${dayNames[today.getDay()]}）のタスク`;

    // モード切替
    modeTimeBtn.addEventListener('click', () => {
      mode = 'time';
      modeTimeBtn.classList.add('active');
      modeTimerBtn.classList.remove('active');
      timeWrap.style.display  = '';
      timerWrap.style.display = 'none';
    });
    modeTimerBtn.addEventListener('click', () => {
      mode = 'timer';
      modeTimerBtn.classList.add('active');
      modeTimeBtn.classList.remove('active');
      timerWrap.style.display = '';
      timeWrap.style.display  = 'none';
    });

    // 時刻セレクト（10分刻み、現在時刻より前は表示しない）
    function buildTimeOptions() {
      const now     = new Date();
      const nowMins = now.getHours() * 60 + now.getMinutes();
      const current = timeInput.value;
      timeInput.innerHTML = '<option value="">時間を選択</option>';
      for (let m = 0; m < 24 * 60; m += 10) {
        if (m <= nowMins) continue;
        const h   = Math.floor(m / 60);
        const min = m % 60;
        const val = `${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
        const opt = document.createElement('option');
        opt.value       = val;
        opt.textContent = val;
        timeInput.appendChild(opt);
      }
      if (current) timeInput.value = current;
    }

    // タイマーセレクト（10分〜600分）
    function buildTimerOptions() {
      timerInput.innerHTML = '<option value="">分後を選択</option>';
      for (let m = 10; m <= 600; m += 10) {
        const opt = document.createElement('option');
        opt.value = m;
        const h = Math.floor(m / 60);
        const min = m % 60;
        if (h === 0) opt.textContent = `${m}分後`;
        else if (min === 0) opt.textContent = `${h}時間後`;
        else opt.textContent = `${h}時間${min}分後`;
        timerInput.appendChild(opt);
      }
    }

    buildTimeOptions();
    buildTimerOptions();
    setInterval(buildTimeOptions, 60_000);

    // ================================================================
    // calendarTasks ストレージ
    // ================================================================
    function getData() {
      try { return JSON.parse(localStorage.getItem('calendarTasks') || '{}'); }
      catch { return {}; }
    }

    function getTasks() { return getData()[dateStr] || []; }

    function saveTasks(tasks) {
      const data = getData();
      if (tasks.length === 0) delete data[dateStr];
      else data[dateStr] = tasks;
      localStorage.setItem('calendarTasks', JSON.stringify(data));
    }

    // ================================================================
    // 通知スケジュール（app.js と同じストレージ共有）
    // ================================================================
    function getNotifications() {
      try { return JSON.parse(localStorage.getItem('scheduledNotifications') || '[]'); }
      catch { return []; }
    }

    function saveNotifications(list) {
      localStorage.setItem('scheduledNotifications', JSON.stringify(list));
    }

    function scheduleNotification(task) {
      const list = getNotifications();
      list.push({ id: task.id, text: task.text, dateStr, notifyTime: task.notifyTime, shown: false });
      saveNotifications(list);
    }

    function removeNotification(taskId) {
      saveNotifications(getNotifications().filter(n => n.id !== taskId));
    }

    async function fireNotification(text) {
      const title   = 'タスクのお知らせ';
      const options = { body: text, icon: './icons/icon.svg', badge: './icons/icon.svg' };
      if ('serviceWorker' in navigator) {
        try {
          const reg = await navigator.serviceWorker.ready;
          await reg.showNotification(title, { ...options, vibrate: [200, 100, 200], requireInteraction: false });
          return;
        } catch (e) {}
      }
      if (Notification.permission === 'granted') {
        new Notification(title, options);
      }
    }

    function checkNotifications() {
      if (Notification.permission !== 'granted') return;
      const now  = new Date();
      const list = getNotifications();
      let changed = false;
      const updated = list.map(n => {
        if (n.shown) return n;
        const target = new Date(`${n.dateStr}T${n.notifyTime}:00`);
        const diff   = now - target;
        if (diff >= 0 && diff < 300_000) {
          const allData = getData();
          const task = (allData[n.dateStr] || []).find(t => t.id === n.id);
          if (task && !task.done) fireNotification(n.text);
          changed = true;
          return { ...n, shown: true };
        }
        if (diff >= 300_000) { changed = true; return { ...n, shown: true }; }
        return n;
      });
      if (changed) saveNotifications(updated);
    }

    // 朝7時に翌日以降の予定を通知
    function checkMorningReminder() {
      if (Notification.permission !== 'granted') return;
      const now = new Date();
      if (now.getHours() !== 7 || now.getMinutes() > 1) return;
      const key = `morningReminder_${dateStr}`;
      if (localStorage.getItem(key)) return;
      const tasks = getTasks().filter(t => !t.done);
      if (tasks.length === 0) return;
      const title   = '今日の予定';
      const options = {
        body:  `今日は${tasks.length}件の予定があります`,
        icon:  './icons/icon.svg',
        badge: './icons/icon.svg',
      };
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage({ type: 'SHOW_NOTIFICATION', title, options });
      } else {
        new Notification(title, options);
      }
      localStorage.setItem(key, '1');
    }

    function updateNotifyBanner() {
      const banner = document.getElementById('notify-banner');
      if (!banner || !('Notification' in window)) return;
      banner.style.display = Notification.permission === 'granted' ? 'none' : 'flex';
    }

    async function requestNotifyFromBanner() {
      if (!('Notification' in window)) return;
      if (Notification.permission === 'denied') {
        alert('通知がブロックされています。\nブラウザのアドレスバー横のアイコンから「通知」を「許可」に変更してください。');
        return;
      }
      await Notification.requestPermission();
      updateNotifyBanner();
    }

    // ================================================================
    // タスク表示
    // ================================================================
    function renderTasks() {
      const tasks = getTasks();
      taskList.innerHTML = '';
      countBadge.textContent = tasks.length;
      emptyMsg.style.display = tasks.length === 0 ? 'block' : 'none';

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');

        const checkbox = document.createElement('input');
        checkbox.type    = 'checkbox';
        checkbox.checked = task.done;
        checkbox.addEventListener('change', () => toggleTask(index));

        const info = document.createElement('div');
        info.className = 'task-info';

        const span = document.createElement('span');
        span.className   = 'task-text';
        span.textContent = task.text;
        info.appendChild(span);

        if (task.notifyTime) {
          const timeTag = document.createElement('span');
          timeTag.className   = 'task-time';
          timeTag.textContent = '🕐 ' + task.notifyTime;
          info.appendChild(timeTag);
        }

        const deleteBtn = document.createElement('button');
        deleteBtn.className   = 'delete-btn';
        deleteBtn.textContent = '×';
        deleteBtn.title       = '削除';
        deleteBtn.addEventListener('click', () => deleteTask(index));

        li.appendChild(checkbox);
        li.appendChild(info);
        li.appendChild(deleteBtn);
        taskList.appendChild(li);
      });
    }

    // ================================================================
    // 過去の未完了タスク
    // ================================================================
    function renderPastTasks() {
      const container = document.getElementById('past-tasks-container');
      const pastList  = document.getElementById('past-task-list');
      const data      = getData();

      const pastEntries = Object.keys(data)
        .filter(d => d < dateStr)
        .sort()
        .map(d => ({ date: d, tasks: data[d].filter(t => !t.done) }))
        .filter(e => e.tasks.length > 0);

      const totalCount = pastEntries.reduce((s, e) => s + e.tasks.length, 0);
      document.getElementById('past-count').textContent = totalCount;

      if (pastEntries.length === 0) {
        container.style.display = 'none';
        return;
      }
      container.style.display = 'block';
      pastList.innerHTML = '';

      pastEntries.forEach(({ date, tasks }) => {
        const [y, m, d] = date.split('-').map(Number);
        const label = document.createElement('div');
        label.className   = 'past-date-label';
        label.textContent = `${m}月${d}日（${dayNames[new Date(y, m - 1, d).getDay()]}）`;
        pastList.appendChild(label);

        tasks.forEach(task => {
          const li = document.createElement('li');
          li.className = 'task-item past-task';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.addEventListener('change', () => {
            const all = getData();
            const t   = (all[date] || []).find(t => t.id === task.id);
            if (t) { t.done = true; localStorage.setItem('calendarTasks', JSON.stringify(all)); }
            renderPastTasks();
          });

          const info = document.createElement('div');
          info.className = 'task-info';
          const span = document.createElement('span');
          span.className   = 'task-text';
          span.textContent = task.text;
          info.appendChild(span);
          if (task.notifyTime) {
            const tt = document.createElement('span');
            tt.className   = 'task-time';
            tt.textContent = '🕐 ' + task.notifyTime;
            info.appendChild(tt);
          }

          const del = document.createElement('button');
          del.className   = 'delete-btn';
          del.textContent = '×';
          del.addEventListener('click', () => {
            const all  = getData();
            const list = all[date] || [];
            const idx  = list.findIndex(t => t.id === task.id);
            if (idx !== -1) {
              removeNotification(list[idx].id);
              list.splice(idx, 1);
              if (list.length === 0) delete all[date]; else all[date] = list;
              localStorage.setItem('calendarTasks', JSON.stringify(all));
            }
            renderPastTasks();
          });

          li.appendChild(cb);
          li.appendChild(info);
          li.appendChild(del);
          pastList.appendChild(li);
        });
      });
    }

    // ================================================================
    // タスク追加・編集・削除
    // ================================================================
    function addTask() {
      const text = input.value.trim();
      if (!text) return;

      let notifyTime = null;
      if (mode === 'time' && timeInput.value) {
        notifyTime = timeInput.value;
      } else if (mode === 'timer' && timerInput.value) {
        const mins   = parseInt(timerInput.value, 10);
        const target = new Date(Date.now() + mins * 60_000);
        notifyTime = `${String(target.getHours()).padStart(2,'0')}:${String(target.getMinutes()).padStart(2,'0')}`;
      }

      const task = {
        id: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
        text,
        done: false,
        notifyTime,
      };
      const tasks = getTasks();
      tasks.push(task);
      saveTasks(tasks);

      if (task.notifyTime) scheduleNotification(task);

      renderTasks();
      input.value      = '';
      timeInput.value  = '';
      timerInput.value = '';
      input.focus();
    }

    function toggleTask(index) {
      const tasks = getTasks();
      tasks[index].done = !tasks[index].done;
      saveTasks(tasks);
      renderTasks();
    }

    function deleteTask(index) {
      const tasks = getTasks();
      removeNotification(tasks[index].id);
      tasks.splice(index, 1);
      saveTasks(tasks);
      renderTasks();
    }

    addBtn.addEventListener('click', addTask);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

    // ================================================================
    // 起動処理
    // ================================================================
    (async () => {
      if ('serviceWorker' in navigator) {
        await navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {});
      }
      updateNotifyBanner();
      document.getElementById('notify-banner-btn').addEventListener('click', requestNotifyFromBanner);
      renderTasks();
      renderPastTasks();
      checkNotifications();
      checkMorningReminder();
      setInterval(() => { checkNotifications(); checkMorningReminder(); }, 60_000);
    })();

    window.addEventListener('storage', e => {
      if (e.key === 'calendarTasks') { renderTasks(); renderPastTasks(); }
    });
  </script>
</body>
</html>
